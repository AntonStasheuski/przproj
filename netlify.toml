[build]
  command = "npm run build"
  publish = "dist"

# SPA: every route is rendered by the client router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# hashed bundles, fonts and images never change under the same URL
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
